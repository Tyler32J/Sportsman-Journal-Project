{% extends 'index.html' %}
{% load static %}

{% block title %}Edit Post{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'index.css' %}">
<link rel="stylesheet" href="{% static 'admin_page.css' %}">
<link rel="stylesheet" href="{% static 'create_post.css' %}">
{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="create-log-card">
        <h1>Edit Post</h1>

        <form method="POST" enctype="multipart/form-data" class="create-log-form">
            {% csrf_token %}

            <div class="image-column">
                <div class="image-preview {% if post.picture %}has-image{% endif %}">
                    <img id="previewImage"
                         src="{% if post.picture %}{{ post.picture.url }}{% else %}{% static 'images/placeholder.jpg' %}{% endif %}"
                         alt="{% if post.picture %}Current Image{% else %}No Image Selected{% endif %}"
                         style="{% if post.picture %}display:block;width:100%;height:100%;object-fit:cover;{% endif %}">
                </div>
                <label class="image-btn">
                    Add Image or Edit
                    <input type="file" name="picture" id="id_picture">
                </label>
            </div>

            <div class="fields-column">
                <div class="input-row">
                    <span>🏷</span>
                    <input type="text" name="title" value="{{ post.title }}" placeholder="Title" required>
                </div>

                <div class="input-row">
                    <span>📍</span>
                    <input type="text" name="location" value="{{ post.location }}" placeholder="Location">
                </div>

                <div class="input-row">
                    <span>📅</span>
                    <input type="date" name="date" value="{{ post.date|date:'Y-m-d' }}" required>
                </div>

                <div class="input-row">
                    <span>📝</span>
                    <input type="number" name="quantity" value="{{ post.quantity }}" placeholder="Quantity">
                </div>

                <div class="actions" style="display:flex;gap:12px;align-items:center;margin-top:10px;">
                    <button type="submit" class="admin-submit-btn" style="margin-top:0;">Save Changes</button>
                    <button type="button" onclick="window.location.href='{% url 'admin_dashboard' %}'" class="admin-btn cancel" style="margin-top:0;">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
